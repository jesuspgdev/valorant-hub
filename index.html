<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport: imprescindible para que la app sea responsive en móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Herramienta personal tipo Notion para gestionar entrenos, estrategias y mejora en Valorant." />
  <title>Valorant Strategy Hub</title>

  <!-- Hoja de estilos principal -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============================================================
       ESTRUCTURA GENERAL
       - .app-layout: contenedor flex (sidebar + contenido)
       - En móvil el sidebar se convierte en menú desplegable
       ============================================================ -->
  <div class="app-layout">

    <!-- ---------- CABECERA MÓVIL (solo visible en pantallas pequeñas) ---------- -->
    <header class="topbar">
      <button class="topbar__menu-btn" id="btnMenu" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar__title">VALORANT<span class="accent">HUB</span></span>
    </header>

    <!-- ---------- MENÚ LATERAL (navegación entre las 5 secciones + inicio) ---------- -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__logo">▲</span>
        <div class="sidebar__brand-text">
          VALORANT<span class="accent">HUB</span>
          <small>Panel de estrategia</small>
        </div>
      </div>

      <nav class="sidebar__nav">
        <!-- Cada botón cambia la sección visible mediante data-section -->
        <button class="nav-item is-active" data-section="inicio">
          <span class="nav-item__icon">🏠</span> Inicio
        </button>
        <button class="nav-item" data-section="equipo">
          <span class="nav-item__icon">👥</span> Equipo
        </button>
        <button class="nav-item" data-section="diario">
          <span class="nav-item__icon">📓</span> Diario de entrenos
        </button>
        <button class="nav-item" data-section="objetivos">
          <span class="nav-item__icon">🎯</span> Objetivo semanal
        </button>
        <button class="nav-item" data-section="agentes">
          <span class="nav-item__icon">🕵️</span> Fichas de agentes
        </button>
        <button class="nav-item" data-section="planificador">
          <span class="nav-item__icon">🗺️</span> Planificador de rondas
        </button>
        <button class="nav-item" data-section="micros">
          <span class="nav-item__icon">⚡</span> Micros
        </button>
        <button class="nav-item" data-section="retrospectivas">
          <span class="nav-item__icon">🔁</span> Retrospectivas
        </button>
        <button class="nav-item" data-section="gestion">
          <span class="nav-item__icon">🗃️</span> Mapas y agentes
        </button>
      </nav>

      <div class="sidebar__bottom">
        <!-- Barra de datos: copia de seguridad y sincronización por archivo -->
        <div class="sidebar__datos">
          <p class="sidebar__datos-titulo">💾 Datos</p>
          <div class="datos-botones">
            <button class="btn btn--secundario btn--pequeno" id="btn-exportar">⬇ Exportar</button>
            <button class="btn btn--secundario btn--pequeno" id="btn-importar">⬆ Importar</button>
            <button class="btn btn--secundario btn--pequeno" id="btn-guardar-archivo">📄 Guardar en archivo</button>
            <button class="btn btn--secundario btn--pequeno" id="btn-abrir-archivo">📂 Abrir archivo</button>
          </div>
        </div>

        <div class="sidebar__footer">
          <p>Versión 1 · Verano</p>
          <p class="muted">Datos guardados en tu navegador</p>
        </div>
      </div>
    </aside>

    <!-- Capa oscura que aparece detrás del menú en móvil (para cerrarlo al tocar) -->
    <div class="overlay" id="overlay"></div>

    <!-- ---------- CONTENIDO PRINCIPAL ----------
         Cada <section> es una "pantalla". Solo una está activa a la vez.
         El JS de cada módulo rellena el contenedor interno. -->
    <main class="content" id="content">

      <!-- 🏠 INICIO -->
      <section class="view is-active" id="view-inicio">
        <div id="inicio-container"></div>
      </section>

      <!-- 👥 EQUIPO -->
      <section class="view" id="view-equipo">
        <div id="equipo-container"></div>
      </section>

      <!-- 📓 DIARIO -->
      <section class="view" id="view-diario">
        <div id="diario-container"></div>
      </section>

      <!-- 🎯 OBJETIVO SEMANAL -->
      <section class="view" id="view-objetivos">
        <div id="objetivos-container"></div>
      </section>

      <!-- 🕵️ AGENTES -->
      <section class="view" id="view-agentes">
        <div id="agentes-container"></div>
      </section>

      <!-- 🗺️ PLANIFICADOR -->
      <section class="view" id="view-planificador">
        <div id="planificador-container"></div>
      </section>

      <!-- ⚡ MICROS -->
      <section class="view" id="view-micros">
        <div id="micros-container"></div>
      </section>

      <!-- 🔁 RETROSPECTIVAS -->
      <section class="view" id="view-retrospectivas">
        <div id="retrospectivas-container"></div>
      </section>

      <!-- 🗃️ MAPAS Y AGENTES -->
      <section class="view" id="view-gestion">
        <div id="gestion-container"></div>
      </section>

    </main>
  </div>

  <!-- ============================================================
       MODAL GENÉRICO REUTILIZABLE
       Se usa para todos los formularios (crear/editar) de la app.
       El contenido se inyecta desde JS con utils.abrirModal().
       ============================================================ -->
  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal__header">
        <h3 id="modal-titulo">Título</h3>
        <button class="modal__close" id="modal-cerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS
       Orden importante: primero utilidades y datos, luego los
       módulos de cada sección, y por último app.js (arranque).
       Se usan variables globales (window.App) en vez de módulos ES
       para que funcione incluso abriendo el archivo directamente.
       ============================================================ -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/carpetas.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/inicio.js"></script>
  <script src="js/equipo.js"></script>
  <script src="js/diario.js"></script>
  <script src="js/objetivos.js"></script>
  <script src="js/agentes.js"></script>
  <script src="js/planificador.js"></script>
  <script src="js/micros.js"></script>
  <script src="js/retrospectivas.js"></script>
  <script src="js/gestion.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
